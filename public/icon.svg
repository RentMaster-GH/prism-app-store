<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="prism1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="prism2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)"/>

  <!-- Modern Prism geometric geometry -->
  <!-- Facet 1 (Left Wing) -->
  <polygon points="256,110 130,330 256,380" fill="url(#prism1)" opacity="0.95"/>
  
  <!-- Facet 2 (Right Wing) -->
  <polygon points="256,110 382,330 256,380" fill="url(#prism2)" opacity="0.9"/>
  
  <!-- Facet 3 (Central Crystal Spine) -->
  <polygon points="256,110 256,380 200,270" fill="#4338ca" opacity="0.4"/>
  <polygon points="256,110 256,380 312,270" fill="#7c3aed" opacity="0.35"/>

  <!-- Light beam reflection -->
  <polygon points="256,110 210,240 256,220" fill="url(#beam)"/>

  <!-- Top Vertex Crystal Star -->
  <circle cx="256" cy="110" r="10" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="110" r="4" fill="#38bdf8"/>
</svg>
